services:
  app:
    image: forge/webcams:production
    build: .
    pull_policy: build
    restart: unless-stopped
    env_file:
      - path: /etc/forge/apps/webcams/runtime.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: forge-proxy
      traefik.http.routers.webcams.rule: Host(`webcams.parabola.si`)
      traefik.http.routers.webcams.entrypoints: tunnel
      traefik.http.services.webcams.loadbalancer.server.port: "3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      start_interval: 1s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  proxy:
    name: forge-proxy
    external: true
