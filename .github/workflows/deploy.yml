name: Deploy to Raspberry Pi 4

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: false
        
    - name: Install Kamal
      run: gem install kamal
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Expose GitHub Runtime for cache
      uses: crazy-max/ghaction-github-runtime@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: katafractari
        password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        
    - name: Set up SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Add server to known hosts
      run: |
        ssh-keyscan -H katafractari.mooo.com >> ~/.ssh/known_hosts
        
    - name: Deploy with Kamal
      env:
        KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
      run: |
        # Test SSH connection first
        ssh -o ConnectTimeout=10 -o BatchMode=yes root@katafractari.mooo.com echo "SSH connection successful"
        
        # Deploy with Kamal
        kamal deploy
        
    - name: Verify deployment
      run: |
        # Wait a moment for the service to be ready
        sleep 30
        
        # Check if the service is responding
        curl -f https://katafractari.mooo.com/ || echo "Service health check failed"