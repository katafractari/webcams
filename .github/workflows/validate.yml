name: Validate application
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Use the public registry cache on this disposable runner
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          settings = json.loads(path.read_text()) if path.exists() else {}
          settings['registry-mirrors'] = ['https://mirror.gcr.io']
          path.write_text(json.dumps(settings))
          PY
          sudo systemctl restart docker
      - name: Prepare synthetic credentials and the production Compose network
        run: |
          sudo install -d -m 0700 /etc/forge/apps/webcams
          cat > /tmp/runtime.env <<'EOF'
          GOOGLE_SHEET_ID=""
          GOOGLE_SHEETS_API_KEY=""
          SHEET_RANGE="A2:B"
          EOF
          sudo install -m 0600 /tmp/runtime.env /etc/forge/apps/webcams/runtime.env
          docker network create forge-proxy
      - name: Validate production routing, storage and source context
        run: |
          sudo docker compose -f compose.forge.yaml config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('/tmp/compose.json'))
          assert d['services']['app']['build']['context'] == os.getcwd()
          assert not d['services']['app'].get('ports')
          assert d['services']['app']['labels']['traefik.http.routers.webcams.entrypoints'] == 'tunnel'
          assert not d['services']['app'].get('volumes')
          assert 'traefik.http.routers.webcams.tls' not in d['services']['app']['labels']
          PY
      - name: Build and verify the real production Compose project
        run: sudo docker compose -p webcams-ci -f compose.forge.yaml up --detach --build --wait --wait-timeout 60
      - name: Clean up the disposable Compose project
        if: always()
        run: sudo docker compose -p webcams-ci -f compose.forge.yaml down --volumes
